name: Build + Release Automatica

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  bump-version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.do_bump.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Auto-incrementar version
        id: do_bump
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -e
          cur=$(grep -oP "APP_VERSION='v?\K[0-9]+\.[0-9]+\.[0-9]+" gestion-empresa.html || echo "1.0.0")
          last=$(gh release list --limit 1 --json tagName --jq '.[0].tagName' 2>/dev/null || echo "")
          last=${last#v}
          if [ -z "$last" ]; then last="$cur"; fi
          if [ "$(printf '%s\n' "$last" "$cur" | sort -V | tail -n1)" = "$last" ]; then
            IFS='.' read -r ma mi pa <<< "$last"
            nex="$ma.$mi.$((pa + 1))"
          else
            nex="$cur"
          fi
          echo "cur=$cur last=$last next=v$nex"
          sed -i "s/APP_VERSION='[^']*'/APP_VERSION='v$nex'/" gestion-empresa.html
          sed -i "s/gestion-empresa-v[0-9.]*/gestion-empresa-v$nex/" sw.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gestion-empresa.html sw.js
          if git diff --cached --quiet; then
            echo "Version ya actualizada, sin commit nuevo."
          else
            git commit -m "chore: bump version a v$nex [skip ci]"
            git push origin main
          fi
          echo "tag=v$nex" >> "$GITHUB_OUTPUT"

  build-windows:
    needs: bump-version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PyInstaller and Pillow
        run: pip install pyinstaller pillow

      - name: Generar favicon.ico
        run: python -c "from PIL import Image; img=Image.open('icon-512.png'); img.save('favicon.ico', format='ICO', sizes=[(16,16),(32,32),(48,48),(64,64),(128,128),(256,256)])"

      - name: Build EXE
        run: python tools/build_windows.py

      - name: Subir EXE como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: exe-artifact
          path: dist/GestionEmpresa.exe

  build-android:
    needs: bump-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Preparar web y resources
        shell: bash
        run: |
          mkdir -p android-app/www
          cp gestion-empresa.html android-app/www/index.html
          cp gestion-empresa.html android-app/www/gestion-empresa.html
          cp sw.js android-app/www/sw.js
          cp manifest.json android-app/www/manifest.json
          cp icon-192.png android-app/www/icon-192.png
          cp icon-512.png android-app/www/icon-512.png
          python3 -c "from PIL import Image; img=Image.open('icon-512.png'); img.save('favicon.ico', format='ICO', sizes=[(16,16),(32,32),(48,48),(64,64),(128,128),(256,256)])" || true
          cp favicon.ico android-app/www/favicon.ico || true
          mkdir -p android-app/resources/icon android-app/resources/icon-only android-app/resources/splash
          cp icon-512.png android-app/resources/icon-only.png
          cp icon-512.png android-app/resources/icon.png

      - name: Instalar Capacitor
        working-directory: android-app
        shell: bash
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap add android

      - name: Generar iconos
        working-directory: android-app
        shell: bash
        run: npx capacitor-assets generate --android || echo "iconos opcionales"

      - name: Build APK
        working-directory: android-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: apk-artifact
          path: android-app/android/app/build/outputs/apk/debug/app-debug.apk

  build-linux:
    needs: bump-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PyInstaller and Pillow
        run: pip install pyinstaller pillow

      - name: Build binario Linux
        run: python tools/build_windows.py

      - name: Empacar .deb
        run: python tools/package_deb.py

      - name: Subir .deb como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifact
          path: dist/gestion-empresa.deb

  release:
    needs: [build-windows, build-android, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - id: version
        shell: bash
        run: |
          v=$(grep -oP "APP_VERSION='\K[0-9]+\.[0-9]+\.[0-9]+" gestion-empresa.html || echo "1")
          echo "tag=v$v" >> "$GITHUB_OUTPUT"

      - name: Descargar artefactos
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publicar release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          tag="${{ steps.version.outputs.tag }}"
          echo "Tag: $tag"
          ls -la artifacts/exe-artifact artifacts/apk-artifact artifacts/linux-artifact
          if ! echo "$tag" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "No se detecto version valida ($tag), abortando"
            exit 1
          fi
          if git ls-remote --tags origin "refs/tags/$tag" | grep -q .; then
            echo "El tag $tag ya existe; se elimina antes de recrearlo."
            gh release delete "$tag" --yes --cleanup-tag
          fi
          cat > notas.md << 'NOTE'
          ## Gestion Empresa AUTOVERSION

          Version generada automaticamente desde el push a main.

          **Escritorio (Windows):** descarga **GestionEmpresa.exe** y ejecutalo.
          **Android:** descarga **app-debug.apk** e instalalo (permite origenes desconocidos).
          **Linux (Debian/Ubuntu):** descarga **gestion-empresa.deb** e instala con `sudo dpkg -i gestion-empresa.deb` (o doble clic).

          ### Notas
          - Escritorio y movil comparten la misma autenticacion (usuario + contrasena).
          - El APK funciona standalone con Firebase (no necesita el PC encendido).
          - El escritorio detecta actualizaciones, las descarga y te avisa para que las apliques (apaga la app y ejecuta el archivo nuevo).

          ### Aviso del antivirus (falso positivo)
          Algunos antivirus (Windows Defender) pueden marcar **GestionEmpresa.exe** como `Trojan:Win32/Wacatac.B!ml`. Es un **falso positivo**: salta por la heuristica de Machine Learning sobre ejecutables "onefile" compilados con PyInstaller, no porque el programa tenga virus. Es una aplicacion propia de codigo abierto (repositorio publico JMBermejias/gestionempresa).

          **Si Defender bloquea el archivo:** Windows Security -> Proteccion contra virus y amenazas -> Historial de proteccion -> Restaurar, y luego Agregar exclusion -> Archivo -> GestionEmpresa.exe.
          NOTE
          sed -i "s/AUTOVERSION/$tag/g" notas.md
          gh release create "$tag" \
            artifacts/exe-artifact/*.exe \
            artifacts/apk-artifact/*.apk \
            artifacts/linux-artifact/*.deb \
            --title "Gestion Empresa $tag" \
            --notes-file notas.md
