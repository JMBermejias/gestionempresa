name: Build EXE + Release Automatica

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PyInstaller and Pillow
        run: pip install pyinstaller pillow

      - name: Leer version del HTML
        id: version
        shell: pwsh
        run: |
          $html = Get-Content -Raw mediotec.html
          $v = "1"
          if ($html -match "APP_VERSION='(\d+)'") { $v = $matches[1] }
          Write-Output "tag=v$v" >> $env:GITHUB_OUTPUT

      - name: Build EXE
        run: python tools/build_windows.py

      - name: Publicar tag y release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ steps.version.outputs.tag }}"
          Write-Output "Tag a publicar: $tag"
          $existing = git ls-remote --tags origin "refs/tags/$tag"
          if ($existing) {
            Write-Output "El tag $tag ya existe; se elimina antes de recrearlo."
            gh release delete "$tag" --yes --cleanup-tag
          }
          $notes = @'
          ## Medicion Obra AUTOVERSION

          Version generada automaticamente desde el push a main.

          **Escritorio (Windows):** descarga **MedicionObra.exe** y ejecutalo.

          **Movil / PWA:** la misma aplicacion web funciona desde el navegador del movil usando el mismo usuario y contrasena.

          ### Notas
          - Escritorio y movil comparten la misma autenticacion (usuario + contrasena).
          - El escritorio se actualiza automaticamente (busca releases y puede auto-aplicar el nuevo .exe).
          '@
          $notes = $notes.Replace('AUTOVERSION', $tag)
          Set-Content -Path "$env:RUNNER_TEMP/notas.md" -Value $notes -Encoding UTF8
          gh release create "$tag" dist/MedicionObra.exe `
            --title "Medicion Obra $tag" `
            --notes-file "$env:RUNNER_TEMP/notas.md"